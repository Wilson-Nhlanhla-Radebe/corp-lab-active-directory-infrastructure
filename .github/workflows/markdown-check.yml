name: Markdown checks

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/markdown-check.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/markdown-check.yml'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
